# ============================================================
# RCA Pilot — 持续集成流水线（CI）
# 触发：push 到 main/develop，或 PR 到 main
# 作用：代码质量门禁（lint / type-check / 测试覆盖率 / 安全扫描 / DB 迁移一致性）
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # 支持手动触发

# 同一分支的旧运行自动取消，节省 CI 资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: 后端 Lint + 类型检查 + 单元测试
  # 使用 SQLite in-memory，无需 PostgreSQL service
  # ============================================================
  lint-and-test:
    name: Backend Lint & Test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff 静态检查
        run: ruff check .
        env:
          PYTHONPATH: backend

      - name: Mypy 类型检查
        run: mypy .
        env:
          PYTHONPATH: backend

      - name: Pytest 单元测试（含覆盖率 80% 门槛）
        run: pytest --cov --cov-fail-under=80
        env:
          PYTHONPATH: backend
          # 使用 SQLite in-memory，覆盖默认 Postgres 配置
          DATABASE_URL: "sqlite:///:memory:"
          ENV: test
          JWT_SECRET: ci-test-secret
          REDIS_ENABLED: "false"

  # ============================================================
  # Job 2: 依赖与代码安全扫描（GxP 供应链要求）
  # pip-audit 依赖 CVE + Trivy 文件系统/配置扫描
  # ============================================================
  security-scan:
    name: Security Scan (pip-audit + Trivy)
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: pip-audit 依赖 CVE 扫描（后端）
        run: |
          python -m pip install --upgrade pip pip-audit
          # 以 requirements.lock（含全部传递依赖的哈希锁定版）为准扫描已知 CVE；发现高危即失败
          pip-audit -r backend/requirements.lock --strict

      - name: Trivy 文件系统扫描（含配置与 secrets）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Bandit SAST 静态安全扫描（后端）
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]"
          # -ll 只卡 Medium 及以上；B104（绑定 0.0.0.0）在 backend/pyproject.toml [tool.bandit] 中豁免
          bandit -r backend -x backend/tests -ll -c backend/pyproject.toml

  # ============================================================
  # Job 3: 前端类型检查 + Lint + 构建
  # 与 lint-and-test 并行运行
  # ============================================================
  typecheck-and-build:
    name: Frontend Lint & Typecheck & Build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci --legacy-peer-deps

      - name: ESLint 检查
        run: npm run lint

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物 dist/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ============================================================
  # Job 4: Alembic 迁移一致性检查（真实 PostgreSQL）
  # 升级到 head → 检查模型一致 → downgrade 往返验证 → 再升级
  # ============================================================
  alembic-check:
    name: Alembic Migration Check
    runs-on: ubuntu-22.04
    needs: lint-and-test

    services:
      postgres:
        image: pgvector/pgvector:pg15  # 与 deploy compose 一致（0006 迁移需要 vector 扩展）
        env:
          POSTGRES_USER: rca
          POSTGRES_PASSWORD: rca-secret
          POSTGRES_DB: rca_pilot
        ports:
          - 5432:5432
        # 等待 Postgres 就绪
        options: >-
          --health-cmd "pg_isready -U rca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: backend
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca-secret
      POSTGRES_DB: rca_pilot

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          # 与生产镜像同源：哈希锁定版（含 alembic/psycopg2），供应链一致
          pip install --require-hashes -r requirements.lock

      - name: 应用迁移到 head
        run: alembic upgrade head

      - name: 检查模型与迁移是否一致
        run: alembic check

      # GxP 系统生命周期内必然多次升级 —— 迁移必须可回滚
      - name: 降级往返验证（downgrade base → 重新 upgrade head）
        run: |
          alembic downgrade base
          alembic upgrade head
