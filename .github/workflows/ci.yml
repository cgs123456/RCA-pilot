# ============================================================
# RCA Pilot — 持续集成流水线（CI）
# 触发：push 到 main/develop，或 PR 到 main
# 作用：代码质量门禁（lint / type-check / 测试覆盖率 / DB 迁移一致性）
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # 支持手动触发

# 同一分支的旧运行自动取消，节省 CI 资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: 后端 Lint + 类型检查 + 单元测试
  # 使用 SQLite in-memory，无需 PostgreSQL service
  # ============================================================
  lint-and-test:
    name: Backend Lint & Test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov pytest-asyncio

      - name: Ruff 静态检查
        run: ruff check .
        env:
          PYTHONPATH: backend

      - name: Mypy 类型检查
        run: mypy .
        env:
          PYTHONPATH: backend

      - name: Pytest 单元测试（含覆盖率 80% 门槛）
        run: pytest --cov --cov-fail-under=80
        env:
          PYTHONPATH: backend
          # 使用 SQLite in-memory，覆盖默认 Postgres 配置
          DATABASE_URL: sqlite:///:memory:
          ENV: test
          JWT_SECRET: ci-test-secret

  # ============================================================
  # Job 2: 前端类型检查 + 构建
  # 与 lint-and-test 并行运行
  # ============================================================
  typecheck-and-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci --legacy-peer-deps

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物 dist/
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ============================================================
  # Job 3: Alembic 迁移一致性检查
  # 依赖 lint-and-test 完成后串行执行
  # 启动 postgres:15-alpine service container 跑真实迁移
  # ============================================================
  alembic-check:
    name: Alembic Migration Check
    runs-on: ubuntu-22.04
    needs: lint-and-test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rca
          POSTGRES_PASSWORD: rca-secret
          POSTGRES_DB: rca_pilot
        ports:
          - 5432:5432
        # 等待 Postgres 就绪
        options: >-
          --health-cmd "pg_isready -U rca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install alembic psycopg2-binary

      - name: 应用迁移到 head
        run: alembic upgrade head
        env:
          PYTHONPATH: backend
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: rca
          POSTGRES_PASSWORD: rca-secret
          POSTGRES_DB: rca_pilot

      - name: 检查模型与迁移是否一致
        run: alembic check
        env:
          PYTHONPATH: backend
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: rca
          POSTGRES_PASSWORD: rca-secret
          POSTGRES_DB: rca_pilot
