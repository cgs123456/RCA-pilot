# ============================================================
# RCA Pilot — 持续部署流水线（CD）
# 触发：CI 全部通过后（workflow_run 门禁，CI 红着不能部署）
# 流程：构建并推送镜像（一次性构建、按服务名打多 tag）→ SBOM → SSH 部署 staging
# ============================================================
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {} # 支持手动触发

# 同一分支的旧部署自动取消，避免重复部署
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # 部署不取消，避免中断

# 默认权限收紧，仅按需提升
permissions:
  contents: read
  packages: write # 推送镜像到 ghcr.io 所需

# 全部服务共用同一个后端镜像（同一 Dockerfile），按 compose 期望的服务名打 tag
env:
  BACKEND_SERVICES: "auth-service case-service evidence-service agent-service audit-service lms-connector bms-connector ems-connector mes-connector"

jobs:
  # ============================================================
  # Job 1: 构建并推送镜像 + SBOM
  # ============================================================
  build-and-push-images:
    name: Build & Push Images
    runs-on: ubuntu-22.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 提取镜像元数据
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成后端镜像 tag 列表（9 个服务名 + latest + sha）
        id: backend-tags
        run: |
          TAGS=""
          for SVC in $BACKEND_SERVICES; do
            TAGS="${TAGS}ghcr.io/${{ steps.meta.outputs.owner }}/${SVC}:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/${SVC}:${{ steps.meta.outputs.sha }}
            "
          done
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 构建并推送后端镜像（一次构建，多服务名 tag）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: ${{ steps.backend-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/frontend:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/frontend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GxP 供应链：生成 SBOM，证明运行镜像与验证记录一致
      - name: 生成 SBOM（Syft）
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          image: ghcr.io/${{ steps.meta.outputs.owner }}/auth-service:${{ steps.meta.outputs.sha }}
          artifact-name: rca-pilot-sbom.spdx.json

  # ============================================================
  # Job 2: 部署到 Staging
  # 通过环境保护规则要求人工审批
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-22.04
    needs: build-and-push-images
    environment:
      name: staging # 环境保护：部署前需要审批
      url: ${{ steps.set-url.outputs.staging-url }}

    steps:
      - name: 提取镜像元数据
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: SSH 部署到 staging 服务器
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          envs: GITHUB_SHA
          script: |
            set -e
            # 进入部署目录（docker-compose.yml 所在路径）
            cd ${{ secrets.STAGING_DEPLOY_PATH }}

            # 指向本次构建的镜像（compose pull 依赖 image: 字段 + RCA_REGISTRY/RCA_IMAGE_TAG）
            export RCA_REGISTRY="ghcr.io/${{ steps.meta.outputs.owner }}"
            export RCA_IMAGE_TAG="${{ steps.meta.outputs.sha }}"

            # 拉取最新镜像（compose 中每个服务都有 image: 字段，pull 不再落空）
            docker compose pull
            # 滚动重启服务
            docker compose up -d

            # 真实健康检查：等待所有服务 /health 通过（替代旧版 sleep 10）
            echo "等待服务就绪..."
            for i in $(seq 1 30); do
              UNHEALTHY=$(docker compose ps --format json | grep -v '"Health":"healthy"' | grep -c 'rca-' || true)
              if [ "$UNHEALTHY" = "0" ]; then
                echo "所有服务健康检查通过"
                docker compose ps
                exit 0
              fi
              sleep 5
            done
            echo "服务健康检查超时"
            docker compose ps
            docker compose logs --tail 50
            exit 1

      - name: 输出部署 URL
        id: set-url
        run: |
          echo "staging-url=https://${{ secrets.STAGING_HOSTNAME || 'staging.rca-pilot.internal' }}" >> $GITHUB_OUTPUT
