# ============================================================
# RCA Pilot — 持续部署流水线（CD）
# 触发：push 到 main 分支（CI 通过后自动部署到 staging）
# 流程：再跑一次 lint 兜底 → 构建并推送镜像 → SSH 部署到 staging
# ============================================================
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {} # 支持手动触发

# 同一分支的旧部署自动取消，避免重复部署
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # 部署不取消，避免中断

# 默认权限收紧，仅按需提升
permissions:
  contents: read
  packages: write # 推送镜像到 ghcr.io 所需

jobs:
  # ============================================================
  # Job 1: 兜底 Lint + 构建并推送 Docker 镜像
  # 推送到 ghcr.io，tag 同时打 latest + commit sha
  # ============================================================
  build-and-push-images:
    name: Build & Push Images
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11（兜底 lint）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖（兜底 lint）
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: 兜底 Lint（保险起见再跑一次）
        working-directory: backend
        run: |
          ruff check .
          mypy .
        env:
          PYTHONPATH: backend

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/rca-pilot-backend:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/rca-pilot-backend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/rca-pilot-frontend:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/rca-pilot-frontend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 2: 部署到 Staging
  # 需要 build-and-push-images 完成
  # 通过环境保护规则要求人工审批
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-22.04
    needs: build-and-push-images
    environment:
      name: staging # 环境保护：部署前需要审批
      url: ${{ steps.set-url.outputs.staging-url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: SSH 部署到 staging 服务器
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            # 进入部署目录（docker-compose.yml 所在路径）
            cd ${{ secrets.STAGING_DEPLOY_PATH }}

            # 拉取最新镜像
            docker compose pull
            # 滚动重启服务（-d 后台运行）
            docker compose up -d

            # 简单健康检查：等待 frontend 容器 ready
            echo "等待服务就绪..."
            sleep 10
            docker compose ps

      - name: 输出部署 URL
        id: set-url
        run: |
          echo "staging-url=https://${{ secrets.STAGING_HOSTNAME || 'staging.rca-pilot.internal' }}" >> $GITHUB_OUTPUT
