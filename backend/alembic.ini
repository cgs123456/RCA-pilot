# Alembic 配置 — RCA Pilot 版本化迁移
# 用法：
#   alembic upgrade head      # 升级到最新
#   alembic downgrade -1      # 回滚一个版本
#   alembic revision -m "xxx" # 创建新版本
#   alembic check             # CI 中检查模型与迁移是否同步

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url 留空，由 env.py 从 shared.config.settings 读取
sqlalchemy.url =

# 时间戳模板（避免多人提交冲突）
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# 自动格式化新生成的迁移文件
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
