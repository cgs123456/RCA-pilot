# Alembic config - RCA Pilot versioned migrations
# NOTE: keep this file ASCII-only. configparser decodes it with the platform
# locale encoding (GBK on zh-CN Windows), and non-ASCII comments break the CLI.
# Usage:
#   alembic upgrade head      # upgrade to latest
#   alembic downgrade -1      # rollback one revision
#   alembic revision -m "msg" # create a new revision
#   alembic check             # CI: verify models and migrations are in sync

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is empty here; env.py reads the DSN from shared.config.settings
sqlalchemy.url =

# timestamp template (avoid conflicts between contributors)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# auto-format newly generated migration files
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
