<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RCA Pilot — AI 调查员工作台</title>
  <meta name="description" content="受 GxP 监管的 Agentic AI 调查员，在偏差发生 4 小时内交付可审计的结构化 RCA 草稿" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (CDN) with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EEF4FF', 100: '#D9E6FF', 200: '#BCD2FF', 300: '#8EB4FF',
              400: '#598DFF', 500: '#0B5FFF', 600: '#0A52E0', 700: '#0945B8',
              800: '#083A94', 900: '#072E70',
            },
            success: { 500: '#0E7C66', 600: '#0B6553', 50: '#E6F4F0' },
            danger:  { 500: '#D72638', 600: '#B81E2E', 50: '#FDECEE' },
            warning: { 500: '#F59E0B', 600: '#D98106', 50: '#FEF3E2' },
            ink: { 900: '#0F172A', 700: '#334155', 500: '#64748B', 300: '#CBD5E1', 100: '#F1F5F9' },
            canvas: '#FAFAF7',
            panel: '#FFFFFF',
            line: '#E5E7EB',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          boxShadow: {
            'card': '0 1px 2px 0 rgb(15 23 42 / 0.04), 0 1px 3px 0 rgb(15 23 42 / 0.06)',
            'card-hover': '0 4px 12px -2px rgb(15 23 42 / 0.08), 0 2px 6px -1px rgb(15 23 42 / 0.05)',
            'pop': '0 12px 32px -8px rgb(15 23 42 / 0.18), 0 4px 12px -2px rgb(15 23 42 / 0.08)',
          },
          animation: {
            'pulse-dot': 'pulseDot 1.6s ease-in-out infinite',
            'stream-blink': 'streamBlink 1s steps(2) infinite',
            'slide-in-right': 'slideInRight 0.28s cubic-bezier(0.16,1,0.3,1)',
            'fade-in': 'fadeIn 0.2s ease-out',
            'scale-in': 'scaleIn 0.18s cubic-bezier(0.16,1,0.3,1)',
          },
        },
      },
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Alpine.js plugins -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="h-full bg-canvas text-ink-900 font-sans antialiased" x-data="rcaApp()" x-init="init()" x-cloak>

  <!-- ============ APP SHELL ============ -->
  <div class="flex h-full">

    <!-- ===== LEFT NAV ===== -->
    <aside class="w-[208px] shrink-0 bg-panel border-r border-line flex flex-col" :class="{ 'w-[60px]': navCollapsed }">
      <!-- Logo -->
      <div class="h-14 flex items-center gap-2.5 px-4 border-b border-line shrink-0">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shrink-0 shadow-sm">
          <i data-lucide="radar" class="w-4.5 h-4.5 text-white" stroke-width="2.5"></i>
        </div>
        <template x-if="!navCollapsed">
          <div class="flex flex-col leading-tight">
            <span class="text-[13px] font-bold text-ink-900">RCA Pilot</span>
            <span class="text-[10px] text-ink-500 font-mono">v2.0 · GxP</span>
          </div>
        </template>
      </div>

      <!-- Nav items -->
      <nav class="flex-1 overflow-y-auto py-3 px-2.5 space-y-0.5">
        <template x-for="item in navItems" :key="item.id">
          <button @click="navigate(item.page)"
            class="w-full flex items-center gap-3 px-2.5 py-2 rounded-md text-[13px] font-medium transition-colors group relative"
            :class="currentPage === item.page ? 'bg-brand-50 text-brand-700' : 'text-ink-700 hover:bg-ink-100'">
            <i :data-lucide="item.icon" class="w-4.5 h-4.5 shrink-0" stroke-width="2"></i>
            <template x-if="!navCollapsed"><span class="truncate" x-text="item.label"></span></template>
            <template x-if="currentPage === item.page">
              <span class="absolute left-0 top-1/2 -translate-y-1/2 w-0.5 h-5 bg-brand-500 rounded-r"></span>
            </template>
            <template x-if="!navCollapsed && item.badge">
              <span class="ml-auto text-[10px] font-semibold px-1.5 py-0.5 rounded-full"
                :class="item.badgeType === 'danger' ? 'bg-danger-50 text-danger-600' : 'bg-brand-50 text-brand-600'"
                x-text="item.badge"></span>
            </template>
          </button>
        </template>
      </nav>

      <!-- Collapse toggle -->
      <div class="p-2.5 border-t border-line">
        <button @click="navCollapsed = !navCollapsed" class="w-full flex items-center gap-3 px-2.5 py-2 rounded-md text-ink-500 hover:bg-ink-100 text-[13px]">
          <i data-lucide="panel-left" class="w-4.5 h-4.5" :class="{ 'rotate-180': navCollapsed }"></i>
          <template x-if="!navCollapsed"><span>收起</span></template>
        </button>
      </div>
    </aside>

    <!-- ===== MAIN AREA ===== -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- ===== TOP BAR ===== -->
      <header class="h-14 bg-panel border-b border-line flex items-center gap-3 px-5 shrink-0">
        <!-- Breadcrumb / context switcher -->
        <div class="flex items-center gap-2 text-[13px]">
          <button @click="navigate('dashboard')" class="text-ink-500 hover:text-ink-900 transition-colors">工作台</button>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-ink-300"></i>
          <span class="font-semibold text-ink-900" x-text="pageTitle"></span>
        </div>

        <!-- Active case pill -->
        <template x-if="activeCase">
          <div class="flex items-center gap-2 ml-2 pl-3 border-l border-line">
            <span class="w-2 h-2 rounded-full" :class="severityDotClass(activeCase.severity)"></span>
            <span class="text-[13px] font-mono font-medium text-ink-700" x-text="activeCase.id"></span>
            <span class="text-[13px] text-ink-500 truncate max-w-[280px]" x-text="activeCase.title"></span>
          </div>
        </template>

        <div class="flex-1"></div>

        <!-- Search / Command bar trigger -->
        <button @click="openCommandBar()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-line bg-ink-100/50 hover:bg-ink-100 text-ink-500 text-[13px] transition-colors w-64">
          <i data-lucide="search" class="w-3.5 h-3.5"></i>
          <span class="flex-1 text-left">搜索或输入命令...</span>
          <kbd class="text-[10px] font-mono px-1.5 py-0.5 bg-panel border border-line rounded text-ink-500">⌘K</kbd>
        </button>

        <!-- Notifications -->
        <button @click="toggleNotifications()" class="relative p-1.5 rounded-lg hover:bg-ink-100 text-ink-700 transition-colors">
          <i data-lucide="bell" class="w-4.5 h-4.5"></i>
          <span class="absolute top-0.5 right-0.5 w-2 h-2 bg-danger-500 rounded-full ring-2 ring-panel"></span>
        </button>

        <!-- User -->
        <div class="flex items-center gap-2 pl-3 border-l border-line">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center text-white text-[12px] font-semibold">LC</div>
          <div class="flex flex-col leading-tight">
            <span class="text-[12px] font-semibold text-ink-900">Lisa Chen</span>
            <span class="text-[10px] text-ink-500">调查员 · 微生物</span>
          </div>
        </div>
      </header>

      <!-- ===== PAGE CONTENT ===== -->
      <main class="flex-1 overflow-hidden relative">
        <!-- P1: Dashboard -->
        <template x-if="currentPage === 'dashboard'">
          <div x-html="renderDashboard()" class="h-full overflow-y-auto"></div>
        </template>

        <!-- P2: Inbox -->
        <template x-if="currentPage === 'inbox'">
          <div x-html="renderInbox()" class="h-full overflow-y-auto"></div>
        </template>

        <!-- P3: Investigation Workbench -->
        <template x-if="currentPage === 'investigation'">
          <div x-html="renderInvestigation()" class="h-full overflow-hidden"></div>
        </template>

        <!-- P4: Evidence Library -->
        <template x-if="currentPage === 'evidence'">
          <div x-html="renderEvidenceLibrary()" class="h-full overflow-y-auto"></div>
        </template>

        <!-- P5: Report Preview -->
        <template x-if="currentPage === 'report'">
          <div x-html="renderReport()" class="h-full overflow-y-auto"></div>
        </template>

        <!-- P6: Audit Trail -->
        <template x-if="currentPage === 'audit'">
          <div x-html="renderAuditTrail()" class="h-full overflow-y-auto"></div>
        </template>

        <!-- P7: Knowledge Hub -->
        <template x-if="currentPage === 'knowledge'">
          <div x-html="renderKnowledge()" class="h-full overflow-y-auto"></div>
        </template>

        <!-- P8: Admin -->
        <template x-if="currentPage === 'admin'">
          <div x-html="renderAdmin()" class="h-full overflow-y-auto"></div>
        </template>
      </main>

      <!-- ===== AI COPILOT DRAWER (right, persistent on investigation) ===== -->
      <template x-if="currentPage === 'investigation'">
        <aside class="w-[340px] shrink-0 bg-panel border-l border-line flex flex-col" :class="{ 'w-[52px]': copilotCollapsed }">
          <!-- Drawer header -->
          <div class="h-14 flex items-center justify-between px-4 border-b border-line shrink-0">
            <template x-if="!copilotCollapsed">
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center">
                  <i data-lucide="bot" class="w-4 h-4 text-white"></i>
                </div>
                <div class="flex flex-col leading-tight">
                  <span class="text-[13px] font-bold">AI Copilot</span>
                  <span class="text-[10px] text-ink-500 font-mono" x-text="activeCase ? activeCase.id : '—'"></span>
                </div>
              </div>
            </template>
            <div class="flex items-center gap-1">
              <button @click="copilotCollapsed = !copilotCollapsed" class="p-1.5 rounded hover:bg-ink-100 text-ink-500">
                <i data-lucide="chevron-right" class="w-4 h-4" :class="{ 'rotate-180': copilotCollapsed }"></i>
              </button>
            </div>
          </div>

          <!-- Agent status list -->
          <template x-if="!copilotCollapsed">
            <div class="flex-1 overflow-y-auto p-3 space-y-2.5">
              <template x-for="agent in agents" :key="agent.id">
                <div class="rounded-lg border p-3 transition-all"
                  :class="agent.status === 'running' ? 'border-brand-300 bg-brand-50/40' : agent.status === 'done' ? 'border-success-500/30 bg-success-50/30' : agent.status === 'challenging' ? 'border-danger-500/30 bg-danger-50/30' : 'border-line bg-panel'">
                  <div class="flex items-center gap-2.5">
                    <div class="w-7 h-7 rounded-md flex items-center justify-center shrink-0"
                      :class="agentColorClass(agent)">
                      <i :data-lucide="agent.icon" class="w-4 h-4" :class="agent.status === 'running' ? 'animate-pulse-dot' : ''"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <div class="flex items-center gap-1.5">
                        <span class="text-[12px] font-semibold" x-text="agent.name"></span>
                        <span class="text-[10px] px-1 py-0.5 rounded font-medium"
                          :class="agentStatusBadgeClass(agent.status)" x-text="agentStatusLabel(agent.status)"></span>
                      </div>
                      <div class="text-[11px] text-ink-500 truncate mt-0.5" x-text="agent.subtitle"></div>
                    </div>
                  </div>
                  <!-- Progress bar -->
                  <div class="mt-2 h-1 bg-ink-100 rounded-full overflow-hidden">
                    <div class="h-full rounded-full transition-all duration-500"
                      :class="agent.status === 'running' ? 'bg-brand-500' : agent.status === 'done' ? 'bg-success-500' : agent.status === 'challenging' ? 'bg-danger-500' : 'bg-ink-300'"
                      :style="`width: ${agent.progress}%`"></div>
                  </div>
                  <!-- Streaming message -->
                  <template x-if="agent.streamText">
                    <div class="mt-2 text-[11px] text-ink-700 font-mono leading-relaxed bg-panel/60 rounded p-2 border border-line/60">
                      <span x-text="agent.streamText"></span><span class="animate-stream-blink inline-block w-1.5 h-3 bg-brand-500 align-middle ml-0.5" x-show="agent.status === 'running'"></span>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Agent controls -->
              <div class="flex items-center gap-2 pt-2 border-t border-line">
                <button @click="runAgents()" :disabled="agentsRunning"
                  class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg bg-brand-500 hover:bg-brand-600 disabled:opacity-50 text-white text-[12px] font-semibold transition-colors">
                  <i data-lucide="play" class="w-3.5 h-3.5"></i>运行
                </button>
                <button @click="pauseAgents()" :disabled="!agentsRunning"
                  class="px-3 py-2 rounded-lg border border-line hover:bg-ink-100 disabled:opacity-50 text-ink-700 text-[12px] font-medium">
                  <i data-lucide="pause" class="w-3.5 h-3.5"></i>
                </button>
                <button @click="resetAgents()" class="px-3 py-2 rounded-lg border border-line hover:bg-ink-100 text-ink-700">
                  <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
          </template>
        </aside>
      </template>

      <!-- ===== AUDIT MINI PANEL (bottom-right) ===== -->
      <div class="absolute bottom-4 right-4 z-30"
        x-data="{ expanded: false }">
        <div class="bg-panel rounded-xl shadow-pop border border-line overflow-hidden transition-all"
          :class="expanded ? 'w-80' : 'w-64'">
          <button @click="expanded = !expanded" class="w-full flex items-center gap-2 px-3 py-2.5 hover:bg-ink-100/50 transition-colors">
            <div class="w-6 h-6 rounded-md bg-success-50 flex items-center justify-center">
              <i data-lucide="shield-check" class="w-3.5 h-3.5 text-success-600"></i>
            </div>
            <div class="flex-1 text-left">
              <div class="text-[11px] font-semibold text-ink-900">合规审计追踪</div>
              <div class="text-[10px] text-ink-500 font-mono" x-text="auditMini.summary"></div>
            </div>
            <i data-lucide="chevron-up" class="w-3.5 h-3.5 text-ink-500" :class="{ 'rotate-180': !expanded }"></i>
          </button>
          <template x-if="expanded">
            <div class="border-t border-line p-3 space-y-1.5 max-h-48 overflow-y-auto">
              <template x-for="log in auditMini.recent" :key="log.id">
                <div class="flex items-start gap-2 text-[10px]">
                  <span class="w-1.5 h-1.5 rounded-full mt-1 shrink-0" :class="log.severity === 'danger' ? 'bg-danger-500' : log.severity === 'warning' ? 'bg-warning-500' : 'bg-brand-500'"></span>
                  <div class="flex-1 min-w-0">
                    <div class="text-ink-900 font-medium" x-text="log.action"></div>
                    <div class="text-ink-500 font-mono" x-text="log.time"></div>
                  </div>
                </div>
              </template>
              <button @click="navigate('audit')" class="w-full text-center text-[10px] text-brand-600 hover:text-brand-700 font-medium pt-1">查看全部 →</button>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ COMMAND BAR (⌘K) ============ -->
  <div x-show="commandBarOpen" x-transition.opacity
    class="fixed inset-0 z-50 bg-ink-900/30 backdrop-blur-sm flex items-start justify-center pt-[12vh]"
    @keydown.escape.window="commandBarOpen = false" @click.self="commandBarOpen = false">
    <div class="w-full max-w-xl bg-panel rounded-xl shadow-pop border border-line overflow-hidden animate-scale-in" @click.stop>
      <div class="flex items-center gap-3 px-4 py-3 border-b border-line">
        <i data-lucide="search" class="w-4.5 h-4.5 text-ink-500"></i>
        <input type="text" x-model="commandQuery" x-init="$watch('commandQuery', () => filterCommands())"
          placeholder="搜索偏差、证据、人员，或输入命令..."
          class="flex-1 bg-transparent outline-none text-[14px] placeholder:text-ink-500" x-ref="cmdInput" />
        <kbd class="text-[10px] font-mono px-1.5 py-0.5 bg-ink-100 border border-line rounded text-ink-500">ESC</kbd>
      </div>
      <div class="max-h-80 overflow-y-auto p-2">
        <template x-for="cmd in filteredCommands" :key="cmd.id">
          <button @click="executeCommand(cmd)" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-brand-50 text-left transition-colors">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
              :class="cmd.category === 'nav' ? 'bg-brand-50 text-brand-600' : cmd.category === 'case' ? 'bg-warning-50 text-warning-600' : 'bg-success-50 text-success-600'">
              <i :data-lucide="cmd.icon" class="w-4 h-4"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-[13px] font-medium text-ink-900" x-text="cmd.title"></div>
              <div class="text-[11px] text-ink-500 truncate" x-text="cmd.subtitle"></div>
            </div>
            <kbd class="text-[10px] font-mono text-ink-500" x-text="cmd.shortcut || ''"></kbd>
          </button>
        </template>
        <div x-show="filteredCommands.length === 0" class="px-4 py-8 text-center text-[13px] text-ink-500">
          未找到匹配项
        </div>
      </div>
    </div>
  </div>

  <!-- ============ SKEPTIC CHALLENGE MODAL ============ -->
  <div x-show="skepticModal.open" x-transition.opacity
    class="fixed inset-0 z-50 bg-ink-900/40 backdrop-blur-sm flex items-center justify-center p-4"
    @keydown.escape.window="skepticModal.open = false">
    <div class="w-full max-w-lg bg-panel rounded-xl shadow-pop border border-danger-500/30 overflow-hidden animate-scale-in" @click.stop>
      <div class="px-5 py-4 bg-danger-50 border-b border-danger-500/20 flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-danger-500 flex items-center justify-center shrink-0">
          <i data-lucide="siren" class="w-5 h-5 text-white"></i>
        </div>
        <div class="flex-1">
          <div class="text-[14px] font-bold text-danger-600">Skeptic 反例挑战</div>
          <div class="text-[11px] text-ink-700">必须审阅 — 此关卡不可跳过</div>
        </div>
        <span class="text-[10px] font-mono px-2 py-1 bg-danger-500 text-white rounded font-semibold">HITL 关卡 3</span>
      </div>
      <div class="p-5 space-y-4">
        <div>
          <div class="text-[11px] font-semibold text-ink-500 uppercase tracking-wide mb-1.5">挑战的结论</div>
          <div class="text-[13px] text-ink-900 bg-ink-100/50 rounded-lg p-3 border border-line" x-text="skepticModal.target"></div>
        </div>
        <div>
          <div class="text-[11px] font-semibold text-danger-600 uppercase tracking-wide mb-1.5">Skeptic 质疑</div>
          <div class="text-[13px] text-ink-900 bg-danger-50/50 rounded-lg p-3 border border-danger-500/20" x-text="skepticModal.challenge"></div>
        </div>
        <div>
          <div class="text-[11px] font-semibold text-ink-500 uppercase tracking-wide mb-1.5">反例证据</div>
          <div class="space-y-1.5">
            <template x-for="ev in skepticModal.evidence" :key="ev.id">
              <div class="flex items-center gap-2 text-[12px] font-mono bg-panel border border-line rounded px-2.5 py-1.5">
                <span class="text-danger-600 font-semibold" x-text="ev.id"></span>
                <span class="text-ink-700" x-text="ev.summary"></span>
              </div>
            </template>
          </div>
        </div>
      </div>
      <div class="px-5 py-3.5 bg-ink-100/40 border-t border-line flex items-center justify-end gap-2">
        <button @click="dismissSkeptic('reject')" class="px-4 py-2 rounded-lg border border-line hover:bg-panel text-ink-700 text-[13px] font-medium">
          驳回反例
        </button>
        <button @click="dismissSkeptic('accept')" class="px-4 py-2 rounded-lg bg-danger-500 hover:bg-danger-600 text-white text-[13px] font-semibold">
          采纳并重新推理
        </button>
      </div>
    </div>
  </div>

  <!-- ============ EVIDENCE DETAIL MODAL ============ -->
  <div x-show="evidenceModal.open" x-transition.opacity
    class="fixed inset-0 z-50 bg-ink-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-panel rounded-xl shadow-pop border border-line overflow-hidden animate-scale-in max-h-[85vh] flex flex-col">
      <div class="px-5 py-4 border-b border-line flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg flex items-center justify-center"
            :class="sourceColorClass(evidenceModal.data?.source)">
            <i :data-lucide="sourceIcon(evidenceModal.data?.source)" class="w-4.5 h-4.5"></i>
          </div>
          <div>
            <div class="text-[14px] font-bold text-ink-900 font-mono" x-text="evidenceModal.data?.id || ''"></div>
            <div class="text-[11px] text-ink-500" x-text="sourceLabel(evidenceModal.data?.source)"></div>
          </div>
        </div>
        <button @click="evidenceModal.open = false" class="p-1.5 rounded-lg hover:bg-ink-100 text-ink-500">
          <i data-lucide="x" class="w-4.5 h-4.5"></i>
        </button>
      </div>
      <div class="p-5 overflow-y-auto space-y-4" x-show="evidenceModal.data">
        <template x-if="evidenceModal.data">
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <div class="bg-ink-100/40 rounded-lg p-3">
                <div class="text-[10px] font-semibold text-ink-500 uppercase">采集时间</div>
                <div class="text-[12px] font-mono text-ink-900 mt-0.5" x-text="evidenceModal.data.timestamp"></div>
              </div>
              <div class="bg-ink-100/40 rounded-lg p-3">
                <div class="text-[10px] font-semibold text-ink-500 uppercase">证据 Hash</div>
                <div class="text-[12px] font-mono text-ink-900 mt-0.5 truncate" x-text="evidenceModal.data.hash"></div>
              </div>
            </div>
            <div>
              <div class="text-[11px] font-semibold text-ink-500 uppercase tracking-wide mb-1.5">摘要</div>
              <div class="text-[13px] text-ink-900 leading-relaxed" x-text="evidenceModal.data.summary"></div>
            </div>
            <div>
              <div class="text-[11px] font-semibold text-ink-500 uppercase tracking-wide mb-1.5">原始数据</div>
              <pre class="text-[11px] font-mono bg-ink-900 text-ink-100 rounded-lg p-3 overflow-x-auto" x-text="JSON.stringify(evidenceModal.data.raw, null, 2)"></pre>
            </div>
            <div class="flex items-center gap-2 pt-2 border-t border-line">
              <span class="text-[11px] text-ink-500">置信度:</span>
              <div class="flex gap-0.5">
                <template x-for="n in 4" :key="n">
                  <span class="w-2 h-2 rounded-full" :class="n <= evidenceModal.data.confidence ? 'bg-brand-500' : 'bg-ink-300'"></span>
                </template>
              </div>
              <span class="text-[11px] font-medium" :class="confidenceLabelClass(evidenceModal.data.confidence)" x-text="confidenceLabel(evidenceModal.data.confidence)"></span>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ============ NOTIFICATIONS PANEL ============ -->
  <div x-show="notifPanelOpen" x-transition.opacity.duration.200ms
    class="fixed inset-0 z-40" @click="notifPanelOpen = false">
    <div class="absolute top-14 right-5 w-80 bg-panel rounded-xl shadow-pop border border-line overflow-hidden animate-slide-in-right" @click.stop>
      <div class="px-4 py-3 border-b border-line flex items-center justify-between">
        <span class="text-[13px] font-bold">通知</span>
        <button class="text-[11px] text-brand-600 hover:text-brand-700 font-medium">全部标为已读</button>
      </div>
      <div class="max-h-96 overflow-y-auto">
        <template x-for="notif in notifications" :key="notif.id">
          <div class="px-4 py-3 border-b border-line/60 hover:bg-ink-100/40 transition-colors cursor-pointer"
            @click="handleNotifClick(notif)">
            <div class="flex items-start gap-2.5">
              <div class="w-7 h-7 rounded-lg flex items-center justify-center shrink-0"
                :class="notif.type === 'danger' ? 'bg-danger-50 text-danger-600' : notif.type === 'warning' ? 'bg-warning-50 text-warning-600' : 'bg-brand-50 text-brand-600'">
                <i :data-lucide="notif.icon" class="w-3.5 h-3.5"></i>
              </div>
              <div class="flex-1 min-w-0">
                <div class="text-[12px] font-medium text-ink-900" x-text="notif.title"></div>
                <div class="text-[11px] text-ink-500 mt-0.5" x-text="notif.body"></div>
                <div class="text-[10px] text-ink-300 font-mono mt-1" x-text="notif.time"></div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ============ TOAST CONTAINER ============ -->
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] space-y-2" style="pointer-events:none;">
    <template x-for="t in toasts" :key="t.id">
      <div class="bg-ink-900 text-white px-4 py-2.5 rounded-lg shadow-pop text-[13px] flex items-center gap-2.5 animate-slide-in-right"
        :class="t.type === 'success' ? 'border-l-2 border-success-500' : t.type === 'danger' ? 'border-l-2 border-danger-500' : 'border-l-2 border-brand-500'">
        <i :data-lucide="t.icon" class="w-4 h-4"></i>
        <span x-text="t.message"></span>
      </div>
    </template>
  </div>

  <!-- ============ SCRIPTS ============ -->
  <script src="js/mockData.js"></script>
  <script src="js/agents.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Alpine init
    document.addEventListener('alpine:init', () => {
      window.rcaApp = rcaApp;
    });
  </script>
  <!-- Alpine.js core (must be last, deferred) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
