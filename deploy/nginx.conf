# RCA Pilot Nginx 配置 — 前端静态资源 + API 反向代理（/api/v1 版本化）
# 容器使用 nginx-unprivileged（非 root），监听 8080
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- 安全响应头 ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 启用 TLS 后再开启（当前入口为 HTTP）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 响应压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- 可信反代头：覆盖而非追加，防止客户端伪造 X-Forwarded-For 绕过限流/伪造审计 IP ----
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-Id $request_id;

    # 静态资源长缓存（Vite 指纹文件名，immutable 安全）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- API v1 反向代理 —— 统一 /api/v1 前缀，按服务名路由 ----
    # 注意：proxy_pass 不带末尾 / —— 完整路径透传给后端
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8001;
    }

    location /api/v1/cases/ {
        proxy_pass http://case-service:8002;
    }

    location /api/v1/dashboard/ {
        proxy_pass http://case-service:8002;
    }

    location /api/v1/source-systems {
        proxy_pass http://case-service:8002;
    }

    location /api/v1/evidence/ {
        proxy_pass http://evidence-service:8003;
    }

    location /api/v1/timeline/ {
        proxy_pass http://evidence-service:8003;
    }

    location /api/v1/agent/ {
        proxy_pass http://agent-service:8004;
    }

    location /api/v1/audit/ {
        proxy_pass http://audit-service:8005;
    }

    # ---- Connectors（经网关访问便于联调；服务间调用走容器网络直连）----
    location /api/v1/lms/ {
        proxy_pass http://lms-connector:8011;
    }

    location /api/v1/bms/ {
        proxy_pass http://bms-connector:8012;
    }

    location /api/v1/ems/ {
        proxy_pass http://ems-connector:8013;
    }

    location /api/v1/mes/ {
        proxy_pass http://mes-connector:8014;
    }

    # ---- 监控端点仅限内网（泄露服务名/状态码/路由表属信息暴露）----
    location ~ ^/(ready|metrics)$ {
        proxy_pass http://case-service:8002;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        access_log off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端容器健康检查（精确匹配，不被上面的正则抢占）
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
