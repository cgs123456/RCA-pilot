# RCA Pilot Nginx 配置 — 前端静态资源 + API 反向代理（/api/v1 版本化）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API v1 反向代理 —— 统一 /api/v1 前缀，按服务名路由
    # 注意：proxy_pass 不带末尾 / —— 完整路径透传给后端
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
    }

    location /api/v1/cases/ {
        proxy_pass http://case-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Trace-Id $request_id;
    }

    location /api/v1/dashboard/ {
        proxy_pass http://case-service:8002;
        proxy_set_header Host $host;
    }

    location /api/v1/source-systems/ {
        proxy_pass http://case-service:8002;
        proxy_set_header Host $host;
    }

    location /api/v1/evidence/ {
        proxy_pass http://evidence-service:8003;
        proxy_set_header Host $host;
    }

    location /api/v1/timeline/ {
        proxy_pass http://evidence-service:8003;
        proxy_set_header Host $host;
    }

    location /api/v1/agent/ {
        proxy_pass http://agent-service:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/audit/ {
        proxy_pass http://audit-service:8005;
        proxy_set_header Host $host;
    }

    location /api/v1/lms/ {
        proxy_pass http://lms-connector:8011;
        proxy_set_header Host $host;
    }

    # 后端直接暴露的健康检查/监控端点（不经过 /api/v1）
    location ~ ^/(health|ready|metrics)$ {
        proxy_pass http://case-service:8002;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端健康检查
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
