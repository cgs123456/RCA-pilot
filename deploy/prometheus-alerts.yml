# RCA Pilot 告警规则 —— Prometheus rule_files 引用
# GxP 系统需要可证明的持续监控：以下为最小可用告警集
groups:
  - name: rca-pilot-availability
    rules:
      - alert: ServiceDown
        expr: up{app="rca-pilot"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "RCA Pilot 服务实例宕机: {{ $labels.job }}/{{ $labels.instance }}"
          description: "实例已持续 5 分钟不可抓取（up==0），请检查容器状态与 /health。"

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_errors_total{app="rca-pilot"}[5m])) by (service)
            /
            clamp_min(sum(rate(http_requests_total{app="rca-pilot"}[5m])) by (service), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx 错误率超过 5%: {{ $labels.service }}"
          description: "最近 5 分钟 5xx 错误率超过 5%，可能存在业务或基础设施故障。"

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{app="rca-pilot"}[5m])) by (le, service)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 延迟超过 2s: {{ $labels.service }}"
          description: "最近 5 分钟 P99 请求延迟超过 2 秒。"

  - name: rca-pilot-business
    rules:
      - alert: AgentPipelineFailureSpike
        expr: sum(rate(rca_agent_runs_total{status="failed"}[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Agent 流水线失败率异常"
          description: "最近 15 分钟失败流水线速率超过 0.1/s，请检查 agent-service 日志与 LLM 配置。"

      - alert: AuditWriteStalled
        expr: increase(rca_audit_logs_total[1h]) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "审计日志 1 小时无新增"
          description: "审计日志 1 小时零增长 —— 系统可能无人使用或审计写入通路故障（GxP 关注项）。"

      - alert: DatabasePoolSaturation
        expr: db_pool_checked_out / clamp_min(db_pool_size, 1) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DB 连接池使用率超过 90%: {{ $labels.service }}"
          description: "连接池接近耗尽，请求将排队或超时。"

      - alert: JtiBlacklistFailOpen
        expr: increase(rca_jti_failopen_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "jti 黑名单降级放行：{{ $labels.op }}"
          description: "Redis 不可用或写入失败，登出/封禁的会话在降级期间仍可通过鉴权（21 CFR Part 11 关注项），请立即恢复 Redis 并评估是否强制全员重登。"

      - alert: LlmCallFailureRateHigh
        expr: >
          sum(increase(rca_llm_calls_total{outcome!="success"}[30m]))
          / clamp_min(sum(increase(rca_llm_calls_total[30m])), 1) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM 调用失败率超过 30%（30 分钟窗口）"
          description: "LLM 服务异常或配置漂移；流水线已自动降级规则模板，请检查 provider 可用性并按 docs/COU.md 第 6 节评审漂移。"

      - alert: LlmCostSpike
        expr: sum(increase(rca_llm_cost_estimated_cny_total[24h])) > 500
        labels:
          severity: warning
        annotations:
          summary: "24 小时 LLM 估算成本超过 500 CNY"
          description: "单案 token 用量可能异常（漂移信号之一，见 docs/COU.md 第 6 节），请核查是否有失控重试或超大案例。"
