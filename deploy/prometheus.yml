global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: 'rca-pilot-backend'
    metrics_path: /metrics
    static_configs:
      # P3-① 架构收敛后的三个后端单元
      - targets:
          - 'core-service:8000'
          - 'agent-service:8004'
          - 'connector-gateway:8010'
        labels:
          app: rca-pilot
