global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: 'rca-pilot-backend'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'auth-service:8001'
          - 'case-service:8002'
          - 'evidence-service:8003'
          - 'agent-service:8004'
          - 'audit-service:8005'
          - 'lms-connector:8011'
          - 'bms-connector:8012'
          - 'ems-connector:8013'
          - 'mes-connector:8014'
        labels:
          app: rca-pilot
